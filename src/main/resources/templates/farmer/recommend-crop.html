<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crop Recommendation</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
        }
        .card {
            width: 500px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2e7d32;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
        }
        button {
            background: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #256628;
        }
		.btn {
		    background-color: #2e7d32;
		    color: white;
		    padding: 10px 18px;
		    border: none;
		    border-radius: 6px;
		    cursor: pointer;
		    font-size: 15px;
		}

		.btn:hover {
		    background-color: #1b5e20;
		}

    </style>
</head>
<body>
	<div class="navbar">
		    <h2>AgroSmart - Farmer</h2>
		    <a href="/farmer/dashboard">Dashboard</a>
		    <a href="/farmer/profile">Profile</a>
			<a href="/farmer/logout">Logout</a>

		</div>

<div class="card">
    <h2>Crop Recommendation 🌱</h2>

	<form action="/farmer/crops/recommend" method="post">

	    <label>Soil Type</label>
	    <select name="soilType" required>
	        <option value="clay">Clay</option>
	        <option value="sandy">Sandy</option>
	        <option value="loamy">Loamy</option>
	    </select>

	    <label>Season</label>
	    <select name="season" required>
	        <option value="summer">Summer</option>
	        <option value="winter">Winter</option>
	        <option value="rainy">Rainy</option>
	    </select>

	    <button type="submit">Get Recommendation</button>

	</form>

</div>

</body>
</html>
