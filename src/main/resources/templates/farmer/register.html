<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Farmer Registration</title>
	<link rel="stylesheet" href="/css/style.css">

</head>
<body>
	<div class="container">

    <h2>Farmer Registration</h2>
	<p style="color:red" th:text="${error}"></p>

    <form th:action="@{/farmer/register}" th:object="${farmer}" method="post">
        Name: <input type="text" th:field="*{name}" required/><br/>
		<p class="error" th:errors="*{name}"></p>

        Email: <input type="email" th:field="*{email}" required/><br/>
		<p class="error" th:errors="*{email}"></p>

        Password: <input type="password" th:field="*{password}" required/><br/>
		<p class="error" th:errors="*{password}"></p>

        Phone: <input type="text" th:field="*{phone}" required/><br/>
		<p class="error" th:errors="*{phone}"></p>
		
        Address: <textarea th:field="*{address}" required></textarea><br/>
		<p class="error" th:errors="*{address}"></p>
		
        <button type="submit">Register</button>
    </form>
    <a href="/farmer/login">Already Registered? Login</a>
	</div>
</body>
</html>
