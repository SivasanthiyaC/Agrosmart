<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Orders</title>
	<link rel="stylesheet" th:href="@{/css/admin.css}">

</head>
<body>
	<div class="container">
<h2>All Orders</h2>

	<table class="admin-table">
<thead>
    <tr>
        <th>Order ID</th>
        <th>Buyer</th>
        <th>Farmer</th>
        <th>Crop</th>
        <th>Quantity</th>
        <th>Status</th>
    </tr>
</thead>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.buyer.name}"></td>
        <td th:text="${order.farmer.name}"></td>
        <td th:text="${order.crop.name}"></td>
        <td th:text="${order.quantity}"></td>
		<td>
		    <span class="status" th:classappend="${order.status}"
		          th:text="${order.status}">
		    </span>
		</td>

    </tr>
</table>

<br>
<a href="/admin/dashboard">⬅ Back</a>
</div>
</body>
</html>
